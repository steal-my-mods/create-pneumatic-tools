plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

version = mod_version
group = mod_group_id

base {
    // The Minecraft version belongs in the file name: a player with three of these in a
    // downloads folder has nothing else to tell them apart.
    archivesName = "${mod_id}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

configurations {
    // Mods we want loaded in the dev runs and never anywhere else.
    //
    // `runtimeClasspath` is what FML scans for mods in a dev run -- it is how Create itself gets
    // loaded here, by way of `implementation` -- so extending it is what makes a jar a mod rather than
    // a library. Two things that look like they would do the job and do not:
    //
    //   * `additionalRuntimeClasspath`, MDG's own hook, is documented as dependencies "that should not
    //     be considered boot classpath modules". It puts the jar among gson and netty in the legacy
    //     classpath file, where FML never scans it, so the mod silently does not exist. A whole client
    //     launch looked like JEI simply failing to appear.
    //   * `RunModel.getAdditionalRuntimeClasspathConfiguration()` exists and reads like a per-run
    //     version of the same thing, but MDG 2.0.144 never registers it on the project; adding to it
    //     from inside a `runs { client { } }` block does nothing at all, and says nothing about it.
    //
    // Not `runtimeOnly`, which would work: this project publishes `from components.java`, and
    // `runtimeElements` -- the variant that publishes -- extends `implementation` and `runtimeOnly`.
    // A dev-only recipe viewer would be recorded there as something a consumer of this mod needs.
    // `runtimeClasspath` is resolvable rather than consumable, so nothing added through it is
    // published.
    devMods
    runtimeClasspath.extendsFrom devMods
}

repositories {
    mavenLocal()
    maven {
        name = 'Create / Catnip / Ponder / Flywheel'
        url = 'https://maven.createmod.net'
    }
    maven {
        name = 'Registrate'
        url = 'https://maven.tterrag.com'
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'JEI (dev client only)'
        url = 'https://maven.blamejared.com'
    }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        minecraftVersion = project.parchment_minecraft_version
        mappingsVersion = project.parchment_mappings_version
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        client {
            client()
            // Boot straight into a world when asked: `./gradlew runClient -PquickPlay=Demo`. Used to
            // photograph the tools without clicking through the menus; harmless when unset.
            if (project.findProperty('quickPlay')) {
                programArgument '--quickPlaySingleplayer'
                programArgument project.property('quickPlay').toString()
            }
            // A -D on the gradle command line lands on the *daemon*, not on the forked client, so
            // CPTPhotoShoot never saw its flag and the run just played the world and logged nothing.
            // Handing it across explicitly is what makes the command in CLAUDE.md true.
            def photos = System.getProperty('createpneumatictools.photos')
            if (photos != null) {
                systemProperty 'createpneumatictools.photos', photos
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Create declares Registrate / Ponder / Flywheel as Maven dependencies but no 1.21.1
// build of them is published to any public repository -- Create ships them as jar-in-jar
// instead. So resolve Create without transitives and unpack its embedded jars onto the
// compile classpath. These must stay compileOnly: at runtime FML loads them straight out
// of Create's own jar, and a second copy on the runtime classpath loads each mod twice.
def createCoordinate = "com.simibubi.create:create-1.21.1:${create_version}"
def createJijDir = layout.buildDirectory.dir('create-jij').get().asFile

configurations {
    createArtifact {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

def unpackCreateJij = tasks.register('unpackCreateJij', Sync) {
    description = "Unpacks Registrate/Ponder/Flywheel out of Create's jar-in-jar bundle"
    from({ zipTree(configurations.createArtifact.singleFile) }) {
        include 'META-INF/jarjar/*.jar'
        eachFile { fcd -> fcd.relativePath = new RelativePath(true, fcd.name) }
        includeEmptyDirs = false
    }
    into createJijDir
}

def createJijJars = fileTree(createJijDir) { include '*.jar' }
createJijJars.builtBy(unpackCreateJij)

dependencies {
    // A recipe viewer for the dev runs. See the `devMods` configuration above for why it is declared
    // there rather than as a `runtimeOnly` or an `additionalRuntimeClasspath` dependency.
    devMods "mezz.jei:jei-${project.minecraft_version}-neoforge:${project.jei_version}"

    createArtifact(createCoordinate) { transitive = false }

    // Create 6.0 for 1.21.1 (NeoForge)
    implementation(createCoordinate) { transitive = false }

    // Registrate, Ponder, Flywheel -- unpacked from Create above
    compileOnly createJijJars
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            create_version_range   : create_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url = "file://${project.projectDir}/repo" }
    }
}

// The licence and the third-party notices travel inside the jar. MIT asks for its notice to
// be included in "copies or substantial portions", and a jar handed to a player is a copy --
// this mod calls into Create's own tool code, so Create's notice has to be in there too.
tasks.named('jar', Jar).configure {
    from(file('LICENSE')) { into 'META-INF' }
    from(file('NOTICE.md')) { into 'META-INF' }
}

// Release notes come from CHANGELOG.md so that a release is described in one place instead of
// being retyped into a web form. It looks up the section for the version actually being
// published rather than whatever is at the top: forgetting to write an entry should stop the
// release, not ship the previous version's notes under a new number.
def latestChangelog() {
    def source = file('CHANGELOG.md')
    def lines = source.exists() ? source.readLines() : []
    def start = lines.findIndexOf { it.startsWith('## ') && it.contains(mod_version) }
    if (start < 0) {
        throw new GradleException(
                "CHANGELOG.md has no '## ' section naming ${mod_version} -- write one before publishing.")
    }
    def rest = lines.drop(start + 1)
    def next = rest.findIndexOf { it.startsWith('## ') }
    return (next < 0 ? rest : rest.take(next)).join('\n').trim()
}

// Uploads the jar to CurseForge and GitHub Releases in one go. Note this is
// `publishMods`, nothing to do with the `publishing` block above -- that one is maven-publish,
// for other addons compiling against this mod.
publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    // Lazily, so a missing changelog section fails the release rather than an ordinary build.
    changelog = providers.provider { latestChangelog() }
    type = STABLE
    modLoaders.add('neoforge')
    // Without this the version is listed as "create-pneumatic-tools 0.1.0", after the Gradle
    // project name, which is not what the mod is called anywhere a player can see.
    displayName = "${mod_name} ${mod_version}"

    // `./gradlew publishMods -PdryRun=true` rehearses the whole thing -- resolving the jar,
    // pulling the changelog section, checking every destination is configured -- and writes what
    // it would have uploaded to build/ instead of uploading it.
    dryRun = providers.gradleProperty('dryRun').map { it.toBoolean() }.orElse(false)

    curseforge {
        projectId = curseforge_project_id
        projectSlug = 'create-pneumatic-tools'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add(minecraft_version)
        // Both sides are required: the server runs the tools, the client draws them.
        clientRequired = true
        serverRequired = true
        requires('create')
    }
    // No `modrinth` block, deliberately -- see the Distribution notes in CLAUDE.md. Don't add one
    // back by only pasting the block: an empty MODRINTH_TOKEN fails at upload rather than at
    // configuration time, which half-publishes a release.
    github {
        repository = github_repository
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('dev')
        // Without this the plugin invents its own tag from mod_version alone, so a `v*` tag push
        // ends up with the release filed under a second, bare tag pointing at the same commit.
        tagName = "v${mod_version}"
    }
}
