name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build

      # GameTests are the real check for this mod -- there is no unit-test suite. The run directory
      # is gitignored, so the server needs its EULA accepting on a fresh checkout.
      - name: Accept the EULA for the test server
        run: |
          mkdir -p run-gametest
          echo 'eula=true' > run-gametest/eula.txt

      - name: GameTests
        run: ./gradlew runGameTestServer

      # Create's ItemDescription renders a missing tooltip key as nothing at all and logs nothing,
      # so a tool can ship with no description and only a player hovering over it would find out.
      - name: Translation keys resolve
        run: python3 tools/check_lang.py

      # Twenty-three config options accumulated before anyone counted them, and the README named one.
      # Nothing breaks when an option goes undocumented, so the only symptom is a server owner who
      # cannot find a knob they were told exists.
      - name: Config options are documented
        run: python3 tools/check_config_docs.py

      # The art and the test template are generated, so a stale checked-in file is a real defect --
      # it would ship in the jar. Regenerating must be a no-op; if it is not, someone edited a
      # sprite by hand or changed a generator and forgot to re-run it.
      - name: Generated assets are up to date
        run: |
          python3 tools/generate_models.py
          python3 tools/generate_textures.py
          python3 tools/generate_structures.py
          python3 tools/generate_recipe_advancements.py
          python3 tools/generate_logo.py
          python3 tools/generate_logo.py branding/icon-512.png --size 512
          # Staged, not a bare diff: a generator that starts emitting a new file nobody committed
          # leaves it untracked, and `git diff` says nothing about untracked files.
          git add -A
          git diff --cached --exit-code

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: createpneumatictools-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload server logs if the tests failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-logs
          path: run-gametest/logs/
          if-no-files-found: ignore
